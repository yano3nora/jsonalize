# goreleaser には compile / archive / checksum / GitHub Release 作成だけを任せる。
# version bump・check/test・tag 付け・人間による publish ゲートは scripts/release.ts 側に残す。
# gistan の構成を横展開したもの。builds セクションだけがプロジェクト固有
# https://goreleaser.com/customization/builds/deno/
version: 2

project_name: jsonalize

builds:
  - builder: deno
    main: main.ts
    binary: jsonalize
    # stdin/stdout だけで完結するため permission flags は不要。
    # 増やす場合は deno.jsonc の compile task と同期させること
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-pc-windows-msvc

archives:
  # asset 命名 (macos / x64) は gistan と揃える。mise `github:yano3nora/jsonalize` の
  # asset 解決を他プロジェクトと同じ形に保つため
  - name_template: >-
      {{ .ProjectName }}-v{{ .Version }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # archive にはバイナリのみ含める (README 等を同梱しない)
    files:
      - none*

checksum:
  algorithm: sha256
  # asset ごとに個別の .sha256 を作る
  split: true

changelog:
  # `gh release create --generate-notes` 相当。GitHub API で release notes を自動生成する
  use: github-native
